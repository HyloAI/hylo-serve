[project]
name = "wc-env-lerobot-robot"
version = "0.1.0.dev0"
description = "worldcurrent environment for real robots through LeRobot's Robot interface (SO-100/101, Koch, LeKiwi, ROS 2 plugins...), plus a simulated arm for bring-up without hardware"
requires-python = ">=3.10"
dependencies = ["wc-core", "numpy>=1.24"]
license = "Apache-2.0"

[project.entry-points."worldcurrent.agents"]
"bringup.wave" = "worldcurrent.envs.lerobot_robot.bringup:BringupWave"

[project.entry-points."worldcurrent.envs"]
"lerobot.robot" = "worldcurrent.envs.lerobot_robot.env:LeRobotRobotEnvironment"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[tool.uv.sources]
wc-core = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-env-lerobot-robot" = "worldcurrent.envs.lerobot_robot:META"
