[project]
name = "hylo-env-lerobot-robot"
version = "0.1.0.dev0"
description = "Hylo environment for real robots through LeRobot's Robot interface (SO-100/101, Koch, LeKiwi, ROS 2 plugins...), plus a simulated arm for bring-up without hardware"
requires-python = ">=3.10"
dependencies = ["hylo-core", "numpy>=1.24"]
license = "Apache-2.0"

[project.entry-points."hylo.agents"]
"bringup.wave" = "hylo.envs.lerobot_robot.bringup:BringupWave"

[project.entry-points."hylo.envs"]
"lerobot.robot" = "hylo.envs.lerobot_robot.env:LeRobotRobotEnvironment"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-env-lerobot-robot" = "hylo.envs.lerobot_robot:META"
