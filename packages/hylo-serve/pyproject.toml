[project]
name = "hylo-serve"
version = "0.1.0.dev0"
description = "Hylo serving: policy server (Hylo + openpi protocols), workcell runtime next to a robot (async chunk execution, hold, watchdog, operator events)"
requires-python = ">=3.10"
dependencies = ["hylo-core", "websockets>=13", "fastapi>=0.110", "uvicorn>=0.29", "pillow>=10"]
license = "Apache-2.0"

[project.entry-points."hylo.commands"]
serve = "hylo.serve.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }
